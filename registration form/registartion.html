<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="stylesheet" href="registration.css" />
</head>
<body>
  <div class="container mt-5 mb-5">
    <form class="p-4 border rounded shadow bg-white">
<h2 class="heading-highlight">
  <i class="bi bi-person-plus-fill text-danger me-2"></i>
  Begin Your Healthcare Journey With Us – <span class="register-now">Register Now</span>
</h2>

      <!-- 👤 Personal Information -->
      <fieldset class="mb-4">
        <legend><i class="bi bi-person-circle"></i> Personal Information</legend>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your Full Name" required />
          </div>
          <div class="col-md-3">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob" name="dob" required />
          </div>
          <div class="col-md-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="">Select</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- 📞 Contact Information -->
      <fieldset class="mb-4">
        <legend><i class="bi bi-telephone-fill"></i> Contact Information</legend>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter your Email id" required />
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter your Phone Number" required />
          </div>
        </div>
      </fieldset>

      <!-- 🏠 Address -->
      <fieldset class="mb-4">
        <legend><i class="bi bi-geo-alt-fill"></i> Address</legend>
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="houseNo" class="form-label">House / Flat No.</label>
            <input type="text" class="form-control" id="houseNo" name="houseNo" required />
          </div>
          <div class="col-md-8">
            <label for="street" class="form-label">Street / Road Name</label>
            <input type="text" class="form-control" id="street" name="street" required />
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="landmark" class="form-label">Landmark (optional)</label>
            <input type="text" class="form-control" id="landmark" name="landmark" />
          </div>
          <div class="col-md-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" name="city" required />
          </div>
          <div class="col-md-3">
            <label for="state" class="form-label">State</label>
            <input type="text" class="form-control" id="state" name="state" required />
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-3">
            <label for="pin" class="form-label">PIN Code</label>
            <input type="text" class="form-control" id="pin" name="pin" required />
          </div>
        </div>
      </fieldset>

      <!-- 🩺 Medical Info -->
      <fieldset class="mb-4">
        <legend><i class="bi bi-heart-pulse-fill"></i> Medical Information</legend>
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="bloodGroup" class="form-label">Blood Group</label>
            <select class="form-select" id="bloodGroup" name="bloodGroup">
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>O+</option><option>O-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="emergencyContact" class="form-label">Emergency Contact</label>
            <input type="tel" class="form-control" id="emergencyContact" name="emergencyContact" />
          </div>
          <div class="col-md-4">
            <label for="userType" class="form-label">Register As</label>
            <select class="form-select" id="userType" name="userType" required>
              <option value="">Select</option>
              <option>Patient</option>
              <option>Doctor</option>
              <option>Staff</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- 🔐 Account Setup -->
      <fieldset class="mb-4">
        <legend><i class="bi bi-lock-fill"></i> Account Setup</legend>
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="password" class="form-label">Create Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required />
          </div>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" required />
          <label class="form-check-label" for="agreeTerms">
            I agree to the Terms and Conditions
          </label>
        </div>
      </fieldset>

      <!-- Submit Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-5">Register</button>
      </div>
    </form>
  </div>
  <script src="registration.js"></script>
</body>
</html>
